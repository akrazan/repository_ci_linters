# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:                      # на каждый пуш в любую ветку
    branches: [ "*" ]
  pull_request:              # на каждый PR в любую ветку
    branches: [ "*" ]
  workflow_dispatch:         # для запуска вручную

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Задание на проверку загружаемых файлов
  lint-and-type-check:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # использовать версию Python 3.12.3

      - name: Install dependencies
        run: |
          # инсталируем библиотеки из requirements.txt
          pip install -r module_30_ci_linters/homework/hw1/requirements.txt
          # импортируем линтеры/типы
          pip install flake8 isort black mypy
      # Black: проверка форматирования (без авто-исправления в CI)
      - name: Black check
        run: black --check .

      # Isort: проверка сортировки импортов
      - name: Isort check
        run: isort --check-only --diff .

      # Flake8: стиль и простые ошибки
      - name: Flake8 check
        run: flake8 .

      # Mypy: статическая типизация
      - name: Mypy check
        run: mypy .
